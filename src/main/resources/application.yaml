server:
  port: 8083

spring:
  application:
    name: snkrlab-ms-carrito
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/snkrlab_cart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true